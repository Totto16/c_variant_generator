name: Build CI

on:
    push:
        branches: ["main"]
    pull_request:
    workflow_dispatch:

jobs:
    build:
        name: ${{ matrix.config.name }}
        runs-on: ${{ matrix.config.os }}-${{ matrix.config.os-version }}

        strategy:
            fail-fast: false
            matrix:
                config:
                    # - name: Windows
                    #   os: windows
                    #   os-version: 2022

                    - name: Linux (GCC, Arm64)
                      os: ubuntu
                      os-version: 26.04-arm
                      use-clang: false

                    - name: Linux (Clang, Arm64)
                      os: ubuntu
                      os-version: 26.04-arm
                      use-clang: true

                    - name: Linux (GCC)
                      os: ubuntu
                      os-version: 26.04
                      use-clang: false

                    - name: Linux (Clang)
                      os: ubuntu
                      os-version: 26.04
                      use-clang: true

                    - name: MacOS (Arm64)
                      os: macos
                      os-version: 26

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: "0"

            - name: Setup MSVC (Windows)
              if: matrix.config.os == 'windows'
              uses: TheMrMilchmann/setup-msvc-dev@v4
              with:
                  arch: x64

            - name: Setup Clang (Linux)
              if: matrix.config.os == 'ubuntu' && matrix.config.use-clang == true
              run: |
                  wget https://apt.llvm.org/llvm.sh
                  chmod +x llvm.sh
                  sudo ./llvm.sh 22
                  echo "CC=clang-22" >> "$GITHUB_ENV"
                  echo "CXX=clang++-22" >> "$GITHUB_ENV"

            - name: Setup GCC (Linux)
              if: matrix.config.os == 'ubuntu' && matrix.config.use-clang == false
              uses: egor-tensin/setup-gcc@v2
              with:
                  version: 14
                  platform: x64 # note, this isn't really correct

            - name: Setup Clang (MacOS)
              if: matrix.config.os == 'macos'
              run: |
                  brew update
                  brew install llvm@22 lld@22
                  echo "$(brew --prefix)/opt/llvm@22/bin" >> $GITHUB_PATH
                  echo "LDFLAGS=-L$(brew --prefix)/opt/llvm@22/lib -L$(brew --prefix)/opt/llvm@22/lib/c++ -Wl,-rpath,$(brew --prefix)/opt/llvm@22/lib/c++" >> "$GITHUB_ENV"
                  echo "CPPFLAGS=-I$(brew --prefix)/opt/llvm@22/include" >> "$GITHUB_ENV"
                  echo "CC=clang" >> "$GITHUB_ENV"
                  echo "CC_LD=lld" >> "$GITHUB_ENV"

            - name: Setup meson (MacOS)
              if: matrix.config.os == 'macos'
              run: |
                  brew update
                  brew install meson
                  ## fix patch behaviour, by adding a replacement to the path
                  sudo mkdir -pv /opt/fakebin
                  echo -e '#!/bin/bash\nset -xe\ngit --work-tree . apply --ignore-whitespace -p1 "$5"' | sudo tee /opt/fakebin/patch
                  sudo chmod +x /opt/fakebin/patch
                  sudo echo "/opt/fakebin" >> $GITHUB_PATH

            # NOTE: meson has no dependencies, so --break-system-packages doesn't really break anything!
            - name: Setup meson
              if: matrix.config.os != 'macos'
              run: |
                  pip install meson --break-system-packages

            - name: Setup node
              uses: actions/setup-node@v7
              with:
                node-version: 24

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                version: 10

            - name: Install dependencies (Linux)
              if: matrix.config.os == 'ubuntu'
              run: |
                  sudo apt-get update
                  sudo apt-get install ninja-build -y --no-install-recommends

            - name: Install dependencies (MacOS)
              if: matrix.config.os == 'macos'
              run: |
                  brew update
                  brew install git

            - name: Configure
              run: |
                meson setup build -Dbuildtype=release --fatal-meson-warnings

            - name: Build
              run: |
                meson compile -C build
