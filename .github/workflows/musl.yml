name: Musl CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-26.04
    container: alpine:3.24

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux GCC (musl)
            use-clang: false

          - name: Linux Clang (musl)
            use-clang: true


    steps:
      - name: Install dependencies
        run: |
          apk update
          apk add wget python3 py3-pip ca-certificates samurai git pkgconf nodejs pnpm bash binutils patch ${{ ( matrix.config.use-clang == true ) && 'lld22 clang22 gcc' || 'gcc musl-dev g++' }}
          echo "CC=${{ matrix.config.use-clang == true && 'clang-22' || 'gcc' }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.config.use-clang == true && 'clang++-22' || 'g++' }}" >> "$GITHUB_ENV"
          echo "CC_LD=${{ matrix.config.use-clang == true && 'lld' || '' }}" >> "$GITHUB_ENV"
          echo "CXX_LD=${{ matrix.config.use-clang == true && 'lld' || '' }}" >> "$GITHUB_ENV"

      # NOTE: meson has no dependencies, so --break-system-packages doesn't really break anything!
      - name: Setup meson
        run: |
            pip install meson --break-system-packages

      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'
  
      - name: Configure
        run: meson setup build -Dbuildtype=release --fatal-meson-warnings

      - name: Build
        run: meson compile -C build
